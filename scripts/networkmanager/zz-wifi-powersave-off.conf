# Override Ubuntu's shipped /etc/NetworkManager/conf.d/default-wifi-powersave-on.conf.
# WiFi power save on the Jetson Orin adds a 10-100 ms wake-up latency to
# small bursty flows (SSH keystrokes, ping, ROS 2 QoS heartbeats), showing
# up as visible typing lag in remote shells.
#
# The zz- prefix ensures this file is scanned after default-*.conf in
# NetworkManager's lexical conf.d walk, so its setting wins.
#
# wifi.powersave values: 0 default, 1 ignore, 2 disable, 3 enable
[connection]
wifi.powersave = 2
